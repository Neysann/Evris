    <text x="26" y="718" fill="#ffffff" font-weight="bold">└─ You &gt; <tspan font-weight="normal" fill="#e6edf3">Open C:\Users\demo\Downloads\setup.bat</tspan></text>
    <text x="34" y="742" fill="#ffb300" font-weight="bold">⚠ Security confirmation required: <tspan font-weight="normal" fill="#e6edf3">Launch 'C:\Users\demo\Downloads\setup.bat' — shell or script execution</tspan></text>
