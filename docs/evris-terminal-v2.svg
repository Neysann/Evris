    <text x="42" y="116" fill="#6e7681">Models  <tspan fill="#00e5ff">FAST</tspan><tspan fill="#e6edf3">=qwen3.5:4b (</tspan><tspan fill="#00e676">ONLINE • READY</tspan><tspan fill="#e6edf3">) | </tspan><tspan fill="#ffb300">PRO</tspan><tspan fill="#e6edf3">=qwen3.5:9b (</tspan><tspan fill="#00e676">RAM OK</tspan><tspan fill="#e6edf3">) | </tspan><tspan fill="#e879f9">LIMITLESS</tspan><tspan fill="#e6edf3">=abliterated:9b (</tspan><tspan fill="#00e676">RAM OK</tspan><tspan fill="#e6edf3">)</tspan></text>
