  <text x="44" y="35" fill="#00e5ff" font-family="Consolas, 'Cascadia Mono', monospace" font-size="13" font-weight="bold">⚡ E.V.R.I.S.</text>
  <text x="204" y="35" fill="#8b949e" font-family="Consolas, monospace" font-size="12">×</text>

