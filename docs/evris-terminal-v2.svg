    <text x="34" y="572" fill="#e879f9">⠋ Streaming LIMITLESS [GENERAL] • huihui_ai/qwen3.5-abliterated:9b <tspan fill="#6e7681">(48 chunks • 74 tok/s • 0.7s)</tspan></text>

    <rect x="26" y="586" width="908" height="78" rx="8" fill="#170f1a" stroke="#e879f9" stroke-width="1.3"/>
    <rect x="40" y="577" width="212" height="16" fill="#0c1017"/>
    <text x="46" y="590" fill="#e879f9" font-weight="bold">EVRIS <tspan fill="#6e7681" font-weight="normal">• LIMITLESS • GENERAL</tspan></text>
    <rect x="642" y="655" width="280" height="15" fill="#0c1017"/>
    <text x="648" y="667" fill="#6e7681" font-size="11.5">huihui_ai/qwen3.5-abliterated:9b • 960 ms</text>
