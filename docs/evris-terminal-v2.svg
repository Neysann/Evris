    <text x="766" y="501" fill="#6e7681" font-size="11.5">qwen3.5:9b • 1180 ms</text>
    <text x="42" y="452" fill="#e6edf3">Bitcoin (BTC-USD) is trading at <tspan fill="#ffffff" font-weight="bold">$91,420.50</tspan> (+2.41% over 24h).</text>
