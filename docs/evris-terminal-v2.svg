  </defs>

  <!-- Outer Window Frame -->
  <rect x="10" y="10" width="940" height="800" rx="10" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Windows Terminal Title Bar -->
